<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-title">שומר מאמרים</div>
    <div class="header-actions">
      <button id="expandBtn" class="gear-btn" title="פתיחה בגודל מלא">⛶</button>
      <button id="settingsBtn" class="gear-btn" title="הגדרות">⚙</button>
    </div>
  </header>

  <div id="mainView">
    <section id="manageSection" class="card">
      <div class="label">ניהול רשימות</div>
      <div class="row">
        <input id="newListName" class="input" type="text" placeholder="שם רשימה חדשה" />
        <button id="addListBtn" class="btn btn-secondary btn-small">הוסף</button>
      </div>
    </section>

    <section id="saveSection" class="card">
      <label class="label" for="listSelect">רשימה פעילה</label>
      <select id="listSelect" class="select"></select>
      <button id="saveBtn" class="btn btn-primary">שמור את המאמר הנוכחי</button>
      <label class="checkbox">
        <input type="checkbox" id="aiToggle" checked />
        <span>הוסף תקציר AI (אם נשמר מפתח)</span>
      </label>
      <div id="saveStatus" class="status"></div>
    </section>

    <section id="listsSection" class="card">
      <div class="section-head">
        <div class="label">הרשימות שלי</div>
        <button id="exportBtn" class="btn btn-secondary btn-small">ייצוא ל-Excel</button>
      </div>
      <div id="listsContainer" class="lists"></div>
    </section>
  </div>

  <div id="settingsView" class="hidden">
    <button id="settingsBackBtn" class="btn btn-small">← חזרה</button>
    <section id="aiSection" class="card">
      <button id="aiSettingsToggle" class="btn btn-secondary btn-small">הגדרות AI</button>
      <div id="aiSettings" class="hidden">
        <div class="label">תקציר AI (Google AI Studio)</div>
        <input id="apiKeyInput" class="input" type="password" placeholder="הזן את ה-API key מ-Google AI Studio" />
        <input id="modelInput" class="input" type="text" placeholder="מודל (למשל gemini-2.0-flash)" />
        <button id="saveApiBtn" class="btn btn-secondary btn-small">שמור מפתח</button>
      </div>
    </section>
  </div>

  <div id="detailView" class="detail hidden">
    <button id="backBtn" class="btn btn-small">← חזרה</button>
    <div id="detailBody"></div>
  </div>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/cpexcel.js"></script>
  <script src="lib/xlsx-js-style.min.js"></script>
  <script src="storage.js"></script>
  <script src="excel-export.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
