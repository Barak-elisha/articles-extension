<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article Saver transfer design QA</title>
  <link rel="stylesheet" href="../sidepanel.css" />
  <style>
    body { min-height: 100vh; margin: 0; padding: 0; }
    .qa-stage { min-height: 100vh; display: grid; place-items: center; padding: 8px; }
    .qa-stage .modal-overlay { position: relative; min-height: calc(100vh - 16px); width: 100%; }
    .qa-stage .toast-container { position: absolute; }
  </style>
</head>
<body>
  <main class="qa-stage" id="qaStage"></main>
  <script>
    const state = new URLSearchParams(location.search).get("state") || "ready";
    const stage = document.getElementById("qaStage");
    if (state === "import") {
      stage.innerHTML = `<div class="modal-overlay"><div class="modal modal-transfer" role="dialog" aria-modal="true"><div class="modal-title">פתיחת קובץ משותף</div><div class="modal-body"><div class="import-preview"><div class="transfer-hero"><div class="transfer-hero-icon">↓</div><div><div class="transfer-hero-title">מחקר על עריכת גנים</div><div class="transfer-hero-subtitle">שותף איתך דרך Article Saver</div></div></div><div class="transfer-metrics"><div class="transfer-metric"><strong>12</strong><span>מאמרים</span></div><div class="transfer-metric"><strong>8</strong><span>תקצירי AI</span></div><div class="transfer-metric"><strong>4</strong><span>צ׳אטים עם AI</span></div><div class="transfer-metric"><strong>19</strong><span>מרקרים</span></div></div><div class="preview-section import-name-section"><label class="label" for="qaName">שם הרשימה בספרייה שלך</label><input id="qaName" class="input" value="מחקר על עריכת גנים" /><div class="field-help">אפשר להשאיר את השם המקורי או לבחור שם חדש לפני ההוספה.</div></div><div class="preview-section"><div class="preview-title">מה יתווסף לספרייה</div><div class="preview-stats">12 מאמרים, 6 הערות ו־9 תגיות</div><div class="preview-chips"><span class="content-chip">תקצירי AI</span><span class="content-chip">צ׳אט AI</span><span class="content-chip">מרקרים</span></div></div><div class="preview-section privacy-note"><strong>נשאר במכשיר שלך</strong><div>Article Saver לא מקבל עותק של התוכן המשותף.</div></div></div></div><div class="modal-actions"><button class="btn btn-primary">הוסף כרשימה חדשה</button><button class="btn btn-secondary">עדכן רשימה קיימת</button><button class="btn btn-quiet">ביטול</button></div></div></div>`;
    } else if (state === "toast") {
      stage.innerHTML = `<div class="toast-container"><div class="toast toast-success" role="status"><span class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="17" height="17"><path d="M20 6 9 17l-5-5"/></svg></span><span class="toast-message">המאמרים נוספו לרשימה</span><button class="toast-close" aria-label="סגור">×</button></div></div>`;
    } else {
      stage.innerHTML = `<div class="modal-overlay"><div class="modal modal-share" role="dialog" aria-modal="true"><div class="share-sheet"><div class="share-ready-hero"><div class="share-ready-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7 9 18l-5-5"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/></svg></div><div><h2 class="share-title">הרשימה מוכנה לשליחה</h2><p class="share-ready-subtitle">נכין עבורך מייל נעים עם כל הפרטים. נשאר רק לצרף את הקובץ ולבחור נמען.</p></div></div><div class="share-ready"><div class="share-ready-file-row"><span class="share-ready-file-icon">↗</span><p class="share-ready-file">הקובץ לצירוף: מחקר-עריכת-גנים.articlesaver</p></div><div class="share-ready-tip">לאחר שהמייל ייפתח, צרף את הקובץ השמור ובחר למי לשלוח אותו.</div><div class="share-ready-actions"><button class="btn btn-primary share-ready-action">פתח מייל</button><button class="btn btn-secondary share-ready-action">העתק הודעה</button></div></div></div></div></div>`;
    }
  </script>
</body>
</html>
